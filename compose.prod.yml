# Production (Dokploy) : l'image est construite et publiée par la CI, ce fichier ne fait que la lancer.
services:
  front:
    # Étiquette immuable (sha-<court>) pour pouvoir revenir en arrière : changer IMAGE_TAG et redéployer.
    image: ghcr.io/mtek-agency/portfolio:${IMAGE_TAG:-latest}
    # Dokploy fait un `up -d` sans `pull` : sans cette ligne, une étiquette flottante comme `latest`
    # ne se mettrait jamais à jour après le premier déploiement.
    pull_policy: always
    container_name: portfolio-front
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_STUDIO_API_URL: ${NUXT_STUDIO_API_URL:?NUXT_STUDIO_API_URL is required}
      NUXT_STUDIO_PUBLIC_URL: ${NUXT_STUDIO_PUBLIC_URL:-}
      NUXT_STUDIO_SITE: ${NUXT_STUDIO_SITE:-portfolio}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?NUXT_PUBLIC_SITE_URL is required}
      NUXT_OG_IMAGE_SECRET: ${NUXT_OG_IMAGE_SECRET:?NUXT_OG_IMAGE_SECRET is required}
      NUXT_TURNSTILE_SITE_KEY: ${NUXT_TURNSTILE_SITE_KEY:-}
    # Pas de port publié : Traefik (Dokploy) atteint le conteneur par le réseau Docker, domaine configuré dans Dokploy.
    expose:
      - "3000"
